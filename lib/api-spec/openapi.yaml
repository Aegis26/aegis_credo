    ImportFileInput:
      type: object
      description: >-
        A normalized QBO/Xero export. All monetary amounts are integer
        minor-unit strings. The server computes a content hash for idempotency —
        no client-supplied ref is used.
      properties:
        source:
          type: string
          enum: [quickbooks, xero]
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ImportAccountInput"
        openingBalances:
          type: array
          items:
            $ref: "#/components/schemas/ImportLineInput"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/ImportTransactionInput"
        openInvoices:
          type: array
          items:
            $ref: "#/components/schemas/ImportInvoiceInput"
        openBills:
          type: array
          items:
            $ref: "#/components/schemas/ImportBillInput"
        onExistingOpening:
          type: string
          enum: [block, replace]
          default: block
          description: >-
            What to do when this org already has imported opening balances
            from a different file. "block" (default) rejects with 409 so the
            books are never silently doubled; "replace" reverses the prior
            opening entries (append-only reversing entries, originals kept)
            and then posts the new ones.
      required: [source, accounts]
    ImportPreviewInput:
      type: object
      description: A raw vendor export to translate into the canonical draft.
      properties:
        report:
          type: string
          description: Which vendor report/adapter to apply.
          enum: [qbo_trial_balance]
        contentType:
          type: string
          description: >-
            Encoding of `content` — CSV text, or base64-encoded XLSX/PDF.
          enum: [csv, xlsx, pdf]
        content:
          type: string
          description: The file body (CSV text, or base64 for xlsx/pdf).
        filename:
          type: string
      required: [report, contentType, content]
    ImportPreviewAccount:
      type: object
      description: >-
        A resolved account from the vendor export. Money fields (debit/credit)
        are integer minor units as strings (e.g. "120100" = $1,201.00), matching
        the canonical import format. `typeSource=mapped` means the account's own
        name resolved; `typeSource=inherited` means the type came from its
        QuickBooks parent account (colon hierarchy); `typeSource=ambiguous`
        means the type could not be determined and MUST be explicitly chosen in
        Review before importing (`type` is only a best-guess candidate).
      properties:
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [asset, liability, equity, revenue, expense]
        typeSource:
          type: string
          enum: [mapped, inherited, ambiguous]
        candidateTypes:
          type: array
          items:
            type: string
            enum: [asset, liability, equity, revenue, expense]
        debit:
          type: string
        credit:
          type: string
      required:
        - code
        - name
        - type
        - typeSource
        - candidateTypes
        - debit
        - credit
    ImportPreviewResult:
      type: object
      description: >-
        The parsed preview plus the canonical draft to confirm and post. No
        ledger posting has occurred. Money totals are integer minor units as
        strings (e.g. "350100" = $3,501.00), matching the import format.
      properties:
        source:
          type: string
          enum: [quickbooks, xero]
        companyName:
          type: string
        asOf:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ImportPreviewAccount"
        totalDebit:
          type: string
        totalCredit:
          type: string
        balanced:
          type: boolean
        ambiguousCount:
          type: integer
        hasExistingOpeningBalances:
          type: boolean
          description: >-
            True when this org already has un-reversed imported opening
            balances from a prior import. The client must then present an
            explicit choice (cancel / new org / replace) before posting —
            posting without a choice is rejected with 409.
        draft:
          $ref: "#/components/schemas/ImportFileInput"
      required:
        - source
        - accounts
        - totalDebit
        - totalCredit
        - balanced
        - ambiguousCount
        - hasExistingOpeningBalances
        - draft
