      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The bills
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createBill
      tags: [bills]
      summary: Create a bill (posts Dr expense / Cr A/P)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillInput"
      responses:
        "201":
          description: The created bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/bills/{billId}/pay:
    post:
      operationId: payBill
      tags: [bills]
      summary: Record a payment on a bill (posts Dr A/P / Cr cash)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: billId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillPaymentInput"
      responses:
        "200":
          description: The updated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Bill not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/reports/ar-aging:
    get:
      operationId: getArAging
      tags: [reports]
      summary: Accounts-receivable aging report
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: asOf
          in: query
          required: false
          description: As-of date (YYYY-MM-DD). Defaults to today.
          schema:
            type: string
      responses:
        "200":
          description: The A/R aging report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArAgingReport"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/payroll-runs:
    get:
      operationId: listPayrollRuns
      tags: [payroll]
      summary: List ingested payroll runs (display only)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The payroll runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRunList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List org members and their roles
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addMember
      tags: [members]
      summary: Invite a user to the org with a role
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: The created / updated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/members/{userId}/revoke:
    post:
      operationId: revokeMember
      tags: [members]
      summary: Revoke a member's access (append-only, sets revokedAt)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The revoked membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Membership not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/accountants:
    post:
      operationId: inviteAccountant
      tags: [members]
      summary: Invite an external accountant (scoped, revocable, audited)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountantInput"
      responses:
        "201":
          description: The accountant membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      description: The client organization id.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
          nullable: true
      required: [id, email, name]
    AuthSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [user]
    SignupRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        name:
          type: string
      required: [email, password]
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]
    ClientRef:
      type: object
      properties:
        orgId:
          type: string
        name:
          type: string
        practiceId:
          type: string
      required: [orgId, name, practiceId]
    ClientList:
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/ClientRef"
      required: [clients]
    DashboardClientClose:
      type: object
      properties:
        period:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        tasksDone:
          type: integer
        tasksTotal:
          type: integer
        progress:
          type: number
        openPbc:
          type: integer
      required: [period, status, tasksDone, tasksTotal, progress, openPbc]
    DashboardClientFinancials:
      type: object
      description: Money fields are decimal strings (e.g. "1234.56").
      properties:
        netIncome:
          type: string
        assets:
          type: string
        liabilities:
          type: string
        balanced:
          type: boolean
      required: [netIncome, assets, liabilities, balanced]
    DashboardClient:
      type: object
      properties:
        orgId:
          type: string
        name:
          type: string
        close:
          $ref: "#/components/schemas/DashboardClientClose"
        financials:
          $ref: "#/components/schemas/DashboardClientFinancials"
      required: [orgId, name, close, financials]
    PracticeDashboard:
      type: object
      properties:
        generatedAt:
          type: string
        clientCount:
          type: integer
        clients:
          type: array
          items:
            $ref: "#/components/schemas/DashboardClient"
      required: [generatedAt, clientCount, clients]
    BatchExportRequest:
      type: object
      properties:
        orgIds:
          type: array
          items:
            type: string
        kind:
          type: string
          enum: [trialBalance, profitAndLoss, balanceSheet]
        format:
          type: string
          enum: [csv, excel]
          default: csv
        skipUnauthorized:
          type: boolean
          default: false
      required: [orgIds, kind]
    ExportFile:
      type: object
      properties:
        name:
          type: string
        contentType:
          type: string
        content:
          type: string
      required: [name, contentType, content]
    BatchExportResponse:
      type: object
      properties:
        kind:
          type: string
        format:
          type: string
        clients:
          type: array
          items:
            type: object
            properties:
              orgId:
                type: string
              name:
                type: string
            required: [orgId, name]
        files:
          type: array
          items:
            $ref: "#/components/schemas/ExportFile"
      required: [kind, format, clients, files]
    ClosePeriod:
      type: object
      properties:
        id:
          type: string
        period:
          type: string
        status:
          type: string
      required: [id, period, status]
    ClosePeriodList:
      type: object
      properties:
        periods:
          type: array
          items:
            $ref: "#/components/schemas/ClosePeriod"
      required: [periods]
    CloseTask:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        sortOrder:
          type: integer
      required: [id, title, status, sortOrder]
    PbcRequest:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        detail:
          type: string
          nullable: true
      required: [id, title, status]
    CloseStatusSummary:
      type: object
      properties:
        period:
          $ref: "#/components/schemas/ClosePeriod"
        tasks:
          type: object
          properties:
            total:
              type: integer
            done:
              type: integer
            inProgress:
              type: integer
            pending:
              type: integer
            progress:
              type: number
            items:
              type: array
              items:
                $ref: "#/components/schemas/CloseTask"
          required: [total, done, inProgress, pending, progress, items]
        pbc:
          type: object
          properties:
            total:
              type: integer
            requested:
              type: integer
            provided:
              type: integer
            accepted:
              type: integer
            open:
              type: integer
            items:
              type: array
              items:
                $ref: "#/components/schemas/PbcRequest"
          required: [total, requested, provided, accepted, open, items]
      required: [period, tasks, pbc]
    OrgInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      required: [name]
    Org:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          nullable: true
      required: [id, name]
    OrgList:
      type: object
      properties:
        orgs:
          type: array
          items:
            $ref: "#/components/schemas/Org"
      required: [orgs]
    Account:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        type:
          type: string
        normalBalance:
          type: string
      required: [id, code, name, type, normalBalance]
    AccountList:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
      required: [accounts]
    RecentEntry:
      type: object
      description: Money fields are decimal strings.
      properties:
        id:
          type: string
        entryDate:
          type: string
        memo:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        amount:
          type: string
      required: [id, entryDate, amount]
    OrgDashboard:
      type: object
      description: Money fields are decimal strings.
      properties:
        cash:
          type: string
        netIncome:
          type: string
        totalDebit:
          type: string
        totalCredit:
          type: string
        difference:
          type: string
        balanced:
          type: boolean
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/RecentEntry"
      required:
        - cash
        - netIncome
        - totalDebit
        - totalCredit
        - difference
        - balanced
        - recentActivity
    TrialBalanceRow:
      type: object
      description: Money fields are decimal strings.
      properties:
        accountId:
          type: string
        code:
          type: string
        name:
          type: string
        type:
          type: string
        debit:
          type: string
        credit:
          type: string
      required: [accountId, code, name, type, debit, credit]
    TrialBalanceReport:
      type: object
      description: Money fields are decimal strings.
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/TrialBalanceRow"
        totalDebit:
          type: string
        totalCredit:
          type: string
        difference:
          type: string
        balanced:
          type: boolean
      required: [rows, totalDebit, totalCredit, difference, balanced]
    ProfitAndLossLine:
      type: object
      description: Money fields are decimal strings.
      properties:
        accountId:
          type: string
        code:
          type: string
        name:
          type: string
        amount:
          type: string
      required: [accountId, code, name, amount]
    ProfitAndLossReport:
      type: object
      description: Money fields are decimal strings.
      properties:
        revenue:
          type: array
          items:
            $ref: "#/components/schemas/ProfitAndLossLine"
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/ProfitAndLossLine"
        totalRevenue:
          type: string
        totalExpenses:
          type: string
        netIncome:
          type: string
      required:
        - revenue
        - expenses
        - totalRevenue
        - totalExpenses
        - netIncome
    BalanceSheetLine:
      type: object
      description: Money fields are decimal strings.
      properties:
        accountId:
          type: string
        code:
          type: string
        name:
          type: string
        amount:
          type: string
      required: [accountId, code, name, amount]
    BalanceSheetReport:
      type: object
      description: Money fields are decimal strings.
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/BalanceSheetLine"
        liabilities:
          type: array
          items:
            $ref: "#/components/schemas/BalanceSheetLine"
        equity:
          type: array
          items:
            $ref: "#/components/schemas/BalanceSheetLine"
        totalAssets:
          type: string
        totalLiabilities:
          type: string
        totalEquity:
          type: string
        netIncome:
          type: string
        equityWithIncome:
          type: string
        totalLiabilitiesAndEquity:
          type: string
        balanced:
          type: boolean
      required:
        - assets
        - liabilities
        - equity
        - totalAssets
        - totalLiabilities
        - totalEquity
        - netIncome
        - equityWithIncome
        - totalLiabilitiesAndEquity
        - balanced
    BankTransaction:
      type: object
      description: amount is a signed decimal string (negative = money out).
      properties:
        id:
          type: string
        txnDate:
          type: string
        description:
          type: string
          nullable: true
        amount:
          type: string
        matched:
          type: boolean
        matchedEntryId:
          type: string
          nullable: true
        accountId:
          type: string
          nullable: true
        suggestedAccountCode:
          type: string
          nullable: true
      required: [id, txnDate, amount, matched]
    BankTransactionList:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/BankTransaction"
      required: [transactions]
    CategorizeInput:
      type: object
      properties:
        accountId:
          type: string
      required: [accountId]
    BankStatus:
      type: object
      properties:
        connected:
          type: boolean
        institutionName:
          type: string
          nullable: true
        lastSyncedAt:
          type: string
          nullable: true
        pendingCount:
          type: integer
        lastSyncError:
          type: string
          nullable: true
        configured:
          type: boolean
      required: [connected, pendingCount, configured]
    BankLinkToken:
      type: object
      properties:
        linkToken:
          type: string
      required: [linkToken]
    BankExchangeInput:
      type: object
      properties:
        publicToken:
          type: string
      required: [publicToken]
    BankSyncResult:
      type: object
      properties:
        added:
          type: integer
        status:
          $ref: "#/components/schemas/BankStatus"
      required: [added, status]
    Invoice:
      type: object
      description: Money fields are decimal strings.
      properties:
        id:
          type: string
        customer:
          type: string
        invoiceNumber:
          type: string
          nullable: true
        invoiceDate:
          type: string
        dueDate:
          type: string
        amount:
          type: string
        paid:
          type: string
        outstanding:
          type: string
        status:
          type: string
        sentAt:
          type: string
          nullable: true
      required:
        - id
        - customer
        - invoiceDate
        - dueDate
        - amount
        - paid
        - outstanding
        - status
    InvoiceList:
      type: object
      properties:
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
      required: [invoices]
    InvoiceInput:
      type: object
      description: amount is a decimal string (e.g. "1200.00").
      properties:
        customer:
          type: string
          minLength: 1
        invoiceNumber:
          type: string
        invoiceDate:
          type: string
        dueDate:
          type: string
        amount:
          type: string
        revenueAccountId:
          type: string
      required: [customer, invoiceDate, dueDate, amount]
    InvoicePaymentInput:
      type: object
      description: amount is a decimal string (e.g. "1200.00").
      properties:
        amount:
          type: string
        paymentDate:
          type: string
        cashAccountId:
          type: string
      required: [amount, paymentDate]
    TaxEstimate:
      type: object
      description: Money fields are decimal strings. This is an estimate, not tax advice.
      properties:
        netIncome:
          type: string
        rate:
          type: number
        estimatedSetAside:
          type: string
        disclaimer:
          type: string
      required: [netIncome, rate, estimatedSetAside, disclaimer]
    ImportAccountInput:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [asset, liability, equity, revenue, expense]
      required: [code, name, type]
    ImportLineInput:
      type: object
      description: debit / credit are integer minor-unit strings (e.g. "150000").
      properties:
        accountCode:
          type: string
        debit:
          type: string
        credit:
          type: string
      required: [accountCode]
    ImportTransactionInput:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
        memo:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ImportLineInput"
      required: [id, date, lines]
    ImportInvoiceInput:
      type: object
      description: amount is an integer minor-unit string.
      properties:
        id:
          type: string
        customer:
          type: string
        invoiceNumber:
          type: string
        invoiceDate:
          type: string
        dueDate:
          type: string
        amount:
          type: string
        arAccountCode:
          type: string
        revenueAccountCode:
          type: string
      required:
        - id
        - customer
        - invoiceDate
        - dueDate
        - amount
        - arAccountCode
        - revenueAccountCode
    ImportBillInput:
      type: object
      description: amount is an integer minor-unit string.
      properties:
        id:
          type: string
        vendor:
          type: string
        billNumber:
          type: string
        billDate:
          type: string
        dueDate:
          type: string
        amount:
          type: string
        apAccountCode:
          type: string
        expenseAccountCode:
          type: string
      required:
        - id
        - vendor
        - billDate
        - dueDate
        - amount
        - apAccountCode
        - expenseAccountCode
    ImportFileInput:
      type: object
      description: >-
        A normalized QBO/Xero export. All monetary amounts are integer
        minor-unit strings. The server computes a content hash for idempotency —
        no client-supplied ref is used.
      properties:
        source:
          type: string
          enum: [quickbooks, xero]
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ImportAccountInput"
        openingBalances:
          type: array
          items:
            $ref: "#/components/schemas/ImportLineInput"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/ImportTransactionInput"
        openInvoices:
          type: array
          items:
            $ref: "#/components/schemas/ImportInvoiceInput"
        openBills:
          type: array
          items:
            $ref: "#/components/schemas/ImportBillInput"
      required: [source, accounts]
    ImportPreviewInput:
      type: object
      description: A raw vendor export to translate into the canonical draft.
      properties:
        report:
          type: string
          description: Which vendor report/adapter to apply.
          enum: [qbo_trial_balance]
        contentType:
          type: string
          description: Encoding of `content` — CSV text, or base64-encoded XLSX.
          enum: [csv, xlsx]
        content:
          type: string
          description: The file body (CSV text, or base64 for xlsx).
        filename:
          type: string
      required: [report, contentType, content]
    ImportPreviewAccount:
      type: object
      description: >-
        A resolved account from the vendor export. Money fields (debit/credit)
        are integer minor units as strings (e.g. "120100" = $1,201.00), matching
        the canonical import format. `typeSource=ambiguous` means the type could
        not be determined from the account name and must be confirmed in Review.
      properties:
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [asset, liability, equity, revenue, expense]
        typeSource:
          type: string
          enum: [mapped, ambiguous]
        candidateTypes:
          type: array
          items:
            type: string
            enum: [asset, liability, equity, revenue, expense]
        debit:
          type: string
        credit:
          type: string
      required:
        - code
        - name
        - type
        - typeSource
        - candidateTypes
        - debit
        - credit
    ImportPreviewResult:
      type: object
      description: >-
        The parsed preview plus the canonical draft to confirm and post. No
        ledger posting has occurred. Money totals are integer minor units as
        strings (e.g. "350100" = $3,501.00), matching the import format.
      properties:
        source:
          type: string
          enum: [quickbooks, xero]
        companyName:
          type: string
        asOf:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ImportPreviewAccount"
        totalDebit:
          type: string
        totalCredit:
          type: string
        balanced:
          type: boolean
        ambiguousCount:
          type: integer
        draft:
          $ref: "#/components/schemas/ImportFileInput"
      required:
        - source
        - accounts
        - totalDebit
        - totalCredit
        - balanced
        - ambiguousCount
        - draft
    ReconciliationAccountRow:
