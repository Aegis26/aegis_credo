  /platform-admin/organizations:
    get:
      operationId: listPlatformOrganizations
      tags: [platform-admin]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { description: Platform organization metadata, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformOrganizationList" } } } }
        "403": { description: Not master admin, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
  /platform-admin/users:
    get:
      operationId: listPlatformUsers
      tags: [platform-admin]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200": { description: Platform users, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformUserList" } } } }
    post:
      operationId: createPlatformUser
      tags: [platform-admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformUserInput" } } } }
      responses:
        "201": { description: User created, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformUser" } } } }
  /platform-admin/users/{userId}/status:
    get:
      operationId: getPlatformUserStatus
      tags: [platform-admin]
      parameters: [ { $ref: "#/components/parameters/UserId" } ]
      responses:
        "200": { description: User status, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformUserStatus" } } } }
  /platform-admin/users/{userId}/deactivate:
    post:
      operationId: deactivatePlatformUser
      tags: [platform-admin]
      parameters: [ { $ref: "#/components/parameters/UserId" } ]
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformUserStatus" } } } }
  /platform-admin/users/{userId}/reactivate:
    post:
      operationId: reactivatePlatformUser
      tags: [platform-admin]
      parameters: [ { $ref: "#/components/parameters/UserId" } ]
      responses:
        "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformUserStatus" } } } }
  /platform-admin/users/{userId}/password-reset:
    post:
      operationId: createPlatformPasswordReset
      tags: [platform-admin]
      parameters: [ { $ref: "#/components/parameters/UserId" } ]
      responses:
        "200": { description: Reset delivery link, content: { application/json: { schema: { $ref: "#/components/schemas/PasswordResetLink" } } } }
  /platform-admin/health:
    get:
      operationId: getPlatformHealth
      tags: [platform-admin]
      responses:
        "200": { description: Aggregate platform health, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformHealth" } } } }
  /auth/password-reset:
    post:
      operationId: completePasswordReset
      tags: [auth]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PasswordResetInput" } } } }
      responses:
        "204": { description: Password reset completed }
        "400": { description: Invalid reset request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
components:
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    OrgId:
      name: orgId
      in: path
      required: true
      description: The client organization id.
      schema:
        type: string
    GroupId:
      name: groupId
      in: path
      required: true
      description: The consolidation group id.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
          nullable: true
      required: [id, email, name]
    AuthSession:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [user]
    SignupRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        name:
          type: string
      required: [email, password]
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]
    ClientRef:
      type: object
      properties:
        orgId:
          type: string
        name:
          type: string
        practiceId:
          type: string
      required: [orgId, name, practiceId]
    ClientList:
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/ClientRef"
      required: [clients]
    DashboardClientClose:
      type: object
      properties:
        period:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        tasksDone:
          type: integer
        tasksTotal:
          type: integer
        progress:
          type: number
        openPbc:
          type: integer
      required: [period, status, tasksDone, tasksTotal, progress, openPbc]
    DashboardClientFinancials:
      type: object
      description: Money fields are decimal strings (e.g. "1234.56").
      properties:
        netIncome:
          type: string
        assets:
          type: string
        liabilities:
          type: string
        balanced:
          type: boolean
      required: [netIncome, assets, liabilities, balanced]
    DashboardClient:
      type: object
      properties:
        orgId:
          type: string
        name:
          type: string
        close:
          $ref: "#/components/schemas/DashboardClientClose"
        financials:
          $ref: "#/components/schemas/DashboardClientFinancials"
      required: [orgId, name, close, financials]
    PracticeDashboard:
      type: object
      properties:
        generatedAt:
          type: string
        clientCount:
          type: integer
        clients:
          type: array
          items:
            $ref: "#/components/schemas/DashboardClient"
      required: [generatedAt, clientCount, clients]
    BatchExportRequest:
      type: object
      properties:
        orgIds:
          type: array
          items:
            type: string
        kind:
          type: string
          enum: [trialBalance, profitAndLoss, balanceSheet]
        format:
          type: string
          enum: [csv, excel]
          default: csv
        skipUnauthorized:
          type: boolean
          default: false
      required: [orgIds, kind]
    ExportFile:
      type: object
      properties:
        name:
          type: string
        contentType:
          type: string
        content:
          type: string
      required: [name, contentType, content]
    BatchExportResponse:
      type: object
      properties:
        kind:
          type: string
        format:
          type: string
        clients:
          type: array
          items:
            type: object
            properties:
              orgId:
                type: string
              name:
                type: string
            required: [orgId, name]
        files:
          type: array
          items:
            $ref: "#/components/schemas/ExportFile"
      required: [kind, format, clients, files]
    ClosePeriod:
      type: object
      properties:
        id:
          type: string
        period:
          type: string
        status:
          type: string
      required: [id, period, status]
    ClosePeriodList:
      type: object
      properties:
        periods:
          type: array
          items:
            $ref: "#/components/schemas/ClosePeriod"
      required: [periods]
    CloseTask:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        sortOrder:
          type: integer
      required: [id, title, status, sortOrder]
    PbcRequest:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        detail:
          type: string
          nullable: true
        response:
          type: string
          nullable: true
      required: [id, title, status]
    CloseStatusSummary:
      type: object
      properties:
        period:
          $ref: "#/components/schemas/ClosePeriod"
        tasks:
          type: object
          properties:
            total:
              type: integer
            done:
              type: integer
            inProgress:
              type: integer
            pending:
              type: integer
            progress:
              type: number
            items:
              type: array
              items:
                $ref: "#/components/schemas/CloseTask"
          required: [total, done, inProgress, pending, progress, items]
        pbc:
          type: object
          properties:
            total:
              type: integer
            requested:
              type: integer
            provided:
              type: integer
            accepted:
              type: integer
            open:
              type: integer
            items:
              type: array
              items:
                $ref: "#/components/schemas/PbcRequest"
          required: [total, requested, provided, accepted, open, items]
      required: [period, tasks, pbc]
    OrgInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        baseCurrency:
          type: string
          pattern: "^[A-Z]{3}$"
          default: USD
      required: [name]
    Org:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        baseCurrency:
          type: string
        role:
          type: string
          nullable: true
      required: [id, name]
    OrgList:
      type: object
      properties:
        orgs:
          type: array
          items:
            $ref: "#/components/schemas/Org"
      required: [orgs]
    Account:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        type:
          type: string
        normalBalance:
          type: string
      required: [id, code, name, type, normalBalance]
    AccountList:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
      required: [accounts]
    RecentEntry:
      type: object
      description: Money fields are decimal strings.
      properties:
        id:
          type: string
        entryDate:
          type: string
        memo:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        amount:
          type: string
      required: [id, entryDate, amount]
    OrgDashboard:
      type: object
      description: Money fields are decimal strings.
      properties:
        cash:
          type: string
        netIncome:
          type: string
        totalDebit:
          type: string
        totalCredit:
          type: string
        difference:
          type: string
        balanced:
          type: boolean
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/RecentEntry"
      required:
        - cash
        - netIncome
        - totalDebit
        - totalCredit
        - difference
        - balanced
        - recentActivity
    TrialBalanceRow:
      type: object
      description: Money fields are decimal strings.
      properties:
        accountId:
          type: string
        code:
          type: string
        name:
          type: string
        type:
          type: string
        debit:
          type: string
        credit:
          type: string
      required: [accountId, code, name, type, debit, credit]
    TrialBalanceReport:
      type: object
      description: Money fields are decimal strings.
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/TrialBalanceRow"
        totalDebit:
          type: string
        totalCredit:
          type: string
        difference:
          type: string
        balanced:
          type: boolean
      required: [rows, totalDebit, totalCredit, difference, balanced]
    ProfitAndLossLine:
      type: object
      description: Money fields are decimal strings.
      properties:
        accountId:
          type: string
        code:
          type: string
        name:
          type: string
        amount:
          type: string
      required: [accountId, code, name, amount]
    ProfitAndLossReport:
      type: object
      description: Money fields are decimal strings.
      properties:
        revenue:
          type: array
          items:
            $ref: "#/components/schemas/ProfitAndLossLine"
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/ProfitAndLossLine"
        totalRevenue:
          type: string
        totalExpenses:
          type: string
        netIncome:
          type: string
      required:
        - revenue
        - expenses
        - totalRevenue
        - totalExpenses
        - netIncome
    BalanceSheetLine:
      type: object
      description: Money fields are decimal strings.
      properties:
        accountId:
          type: string
        code:
          type: string
        name:
          type: string
        amount:
          type: string
      required: [accountId, code, name, amount]
    BalanceSheetReport:
      type: object
      description: Money fields are decimal strings.
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/BalanceSheetLine"
        liabilities:
          type: array
          items:
            $ref: "#/components/schemas/BalanceSheetLine"
        equity:
          type: array
          items:
            $ref: "#/components/schemas/BalanceSheetLine"
        totalAssets:
          type: string
        totalLiabilities:
          type: string
        totalEquity:
          type: string
        netIncome:
          type: string
        equityWithIncome:
          type: string
        totalLiabilitiesAndEquity:
          type: string
        balanced:
          type: boolean
      required:
        - assets
        - liabilities
        - equity
        - totalAssets
        - totalLiabilities
        - totalEquity
        - netIncome
        - equityWithIncome
        - totalLiabilitiesAndEquity
        - balanced
    BankTransaction:
      type: object
      description: amount is a signed decimal string (negative = money out).
      properties:
        id:
          type: string
        txnDate:
          type: string
        description:
          type: string
          nullable: true
        amount:
          type: string
        matched:
          type: boolean
        matchedEntryId:
          type: string
          nullable: true
        accountId:
          type: string
          nullable: true
        suggestedAccountCode:
          type: string
          nullable: true
      required: [id, txnDate, amount, matched]
    BankTransactionList:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/BankTransaction"
      required: [transactions]
    BankStatementExtractInput:
      type: object
      properties:
        content:
          type: string
          description: The PDF file body, base64-encoded. Held in memory only.
        filename:
          type: string
      required: [content]
    BankStatementTxn:
      type: object
      description: >-
        One extracted statement line. `amount` is a signed decimal string in the
        statement currency (negative = money out), parsed server-side to integer
        minor units — never a float.
      properties:
        date:
          type: string
          description: ISO date (YYYY-MM-DD)
        description:
          type: string
        amount:
          type: string
        lowConfidence:
          type: boolean
          description: True when the model was unsure about this row — review it carefully.
        chainBreak:
          type: boolean
          description: >-
            True when the statement's printed running balance for this row does
            not equal the previous balance ± this amount — a likely misread.
        transferGroup:
          type: string
          nullable: true
          description: >-
            Non-null when this row is one leg of a detected internal transfer
            between two accounts on the same statement; both legs share the id.
      required: [date, description, amount, lowConfidence, chainBreak, transferGroup]
    BankStatementAccount:
      type: object
      description: >-
        One bank account on the statement, reconciled independently:
        opening + sum(transactions) vs closing, computed server-side in
        integer minor units.
      properties:
        accountName:
          type: string
        accountNumberLast4:
          type: string
          nullable: true
        openingBalance:
          type: string
        closingBalance:
          type: string
        computedClosingBalance:
          type: string
        balanced:
          type: boolean
        discrepancy:
          type: string
          description: closing − (opening + sum), formatted decimal; "0.00" when balanced.
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/BankStatementTxn"
      required:
        [accountName, accountNumberLast4, openingBalance, closingBalance, computedClosingBalance, balanced, discrepancy, transactions]
    BankStatementExtraction:
      type: object
      description: >-
        Dry-run extraction result. Each account reconciles independently, and
        the statement-level cross-check compares the sum of closing balances to
        the statement's stated total ending balance (when it prints one) — the
        catch-all that fails if an entire account was missed.
      properties:
        periodStart:
          type: string
          nullable: true
        periodEnd:
          type: string
          nullable: true
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/BankStatementAccount"
        statementTotalEndingBalance:
          type: string
          nullable: true
          description: The statement's stated combined ending balance, if printed.
        sumOfClosingBalances:
          type: string
          description: Server-computed sum of every account's stated closing balance.
        totalMatches:
          type: boolean
          nullable: true
          description: >-
            Whether sumOfClosingBalances equals statementTotalEndingBalance;
            null when the statement does not print a combined total.
        statementHash:
          type: string
          description: SHA-256 of the uploaded PDF content.
      required:
        [accounts, statementTotalEndingBalance, sumOfClosingBalances, totalMatches, statementHash]
    BankStatementConfirmInput:
      type: object
      properties:
        accounts:
          type: array
          items:
            type: object
            description: >-
              One reviewed account: exactly one of cashAccountId (existing
              ledger cash account) or newAccount (create one) must be provided.
            properties:
              accountName:
                type: string
              accountNumberLast4:
                type: string
                nullable: true
              openingBalance:
                type: string
                description: Reviewed opening balance; the server re-verifies opening + all rows (including excluded) = closing.
              closingBalance:
                type: string
              cashAccountId:
                type: string
                nullable: true
              newAccount:
                type: object
                nullable: true
                properties:
                  code:
                    type: string
                  name:
                    type: string
                required: [code, name]
              transactions:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                    description:
                      type: string
                    amount:
                      type: string
                    excluded:
                      type: boolean
                      description: >-
                        Reviewed-out rows (e.g. internal-transfer legs). They
                        still count toward the balance verification but are
                        not imported.
                  required: [date, description, amount]
            required: [accountName, openingBalance, closingBalance, transactions]
      required: [accounts]
