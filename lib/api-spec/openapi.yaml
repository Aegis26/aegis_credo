  /orgs/{orgId}/import:
    post:
      operationId: importAccountingFile
      tags: [import]
      summary: Import a QBO/Xero export via the posting service
      description: >-
        Ingests a normalized accounting export. Every economic event posts
        through the ledger. Fully idempotent by file content: a content hash is
        computed server-side, so re-importing the same file posts nothing new.
        Returns a reconciliation report proving the ledger reproduces the file's
        own trial balance.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportFileInput"
      responses:
        "200":
          description: The reconciliation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationReport"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            The org already has imported opening balances from a different
            file and no explicit onExistingOpening choice was made — the
            import is blocked so the books are never silently doubled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/import/preview:
    post:
      operationId: previewImport
      tags: [import]
      summary: Preview a vendor export (CSV/XLSX) before importing
      description: >-
        Dry-run adapter step. Translates a raw vendor export (currently a
        QuickBooks Online "Trial Balance" CSV or XLSX) into the canonical import
        draft WITHOUT posting anything to the ledger. Returns the resolved
        accounts (with account-type resolution flagged when ambiguous) and the
        canonical draft the client confirms and then posts to /orgs/{orgId}/import.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPreviewInput"
      responses:
        "200":
          description: The parsed preview and canonical draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreviewResult"
        "400":
