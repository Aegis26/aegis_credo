openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication — signup, login, logout, session
  - name: practice
    description: Accounting practice layer — cross-client access, dashboard, batch export
  - name: close
    description: Month-end close management per client
  - name: orgs
    description: Freelancer organizations — onboarding, membership, chart of accounts
  - name: reports
    description: Ledger-derived financial reports (trial balance, P&L, balance sheet)
  - name: bank
    description: Bank connection (Plaid) and reconciliation of bank transactions
  - name: invoices
    description: Accounts-receivable invoicing via the posting service
  - name: tax
    description: Tax set-aside estimator (estimate only, not tax advice)
  - name: import
    description: Migrate-in — import a QBO/Xero export via the posting service
  - name: bills
    description: Accounts-payable bills via the posting service
  - name: payroll
    description: Payroll runs ingested from a provider (display only)
  - name: members
    description: Org membership — user management, roles, accountant collaboration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create an account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created; session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials (also returned for a locked account, to avoid leaking account existence)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Return the currently authenticated user
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /practice/clients:
    get:
      operationId: listPracticeClients
      tags: [practice]
      summary: List a practice user's clients
      description: >-
        Returns exactly the client orgs the practice user has been explicitly
        granted (the client switcher/list). Ungranted clients never appear.
        Identity comes from the authenticated session, not the request.
      responses:
        "200":
          description: The user's granted clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /practice/dashboard:
    get:
      operationId: getPracticeDashboard
      tags: [practice]
      summary: Practice-level dashboard across all granted clients
      description: >-
        Read-only cross-client status: latest close progress and headline
        financials for every client the user was granted. Money fields are
        decimal strings. Identity comes from the authenticated session.
      parameters:
        - name: practiceId
          in: query
          required: false
          description: Restrict to a single practice the user is a member of.
          schema:
            type: string
      responses:
        "200":
          description: The practice dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeDashboard"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /practice/batch-export:
    post:
      operationId: batchExportReports
      tags: [practice]
      summary: Run and export a report across a book of clients
      description: >-
        Runs the same report across the requested clients (restricted to the
        ones the user was granted) and serializes them to CSV (one file per
        client) or a single multi-sheet Excel workbook. Rejects the request if
        it references a client the user was not granted, unless skipUnauthorized
        is set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchExportRequest"
      responses:
        "200":
          description: The exported files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchExportResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The request referenced an ungranted client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{orgId}/close-periods:
    get:
      operationId: listClosePeriods
      tags: [close]
      summary: List a client's close periods
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The client's close periods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosePeriodList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The user was not granted this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{orgId}/close-periods/{periodId}/status:
    get:
      operationId: getCloseStatus
      tags: [close]
      summary: Derived status of one close period
      description: >-
        Checklist progress and PBC request state for a close period. Progress is
        derived from the tasks, never stored.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: periodId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The close period status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseStatusSummary"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The user was not granted this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs:
    get:
      operationId: listMyOrgs
      tags: [orgs]
      summary: List organizations the authenticated user belongs to
      description: >-
        Returns exactly the orgs the session user has an active membership in.
        Identity comes from the session — never from the request.
      responses:
        "200":
          description: The user's organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrg
      tags: [orgs]
      summary: Create an organization and seed its starter chart of accounts
      description: >-
        Creates a new org, seeds the standard chart of accounts, and makes the
        session user its owner. Identity comes from the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/accounts:
    get:
      operationId: listAccounts
      tags: [orgs]
      summary: List the chart of accounts for an org
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The chart of accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/dashboard:
    get:
      operationId: getOrgDashboard
      tags: [orgs]
      summary: Headline dashboard for an org
      description: >-
        Cash position, current net income, trial-balance totals (which always
        net to zero), and recent ledger activity. Money fields are decimal
        strings.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The org dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDashboard"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/reports/trial-balance:
    get:
      operationId: getTrialBalanceReport
      tags: [reports]
      summary: Trial balance for an org
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The trial balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialBalanceReport"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/reports/profit-and-loss:
    get:
      operationId: getProfitAndLossReport
      tags: [reports]
      summary: Profit and loss for an org
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The profit and loss
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfitAndLossReport"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/reports/balance-sheet:
    get:
      operationId: getBalanceSheetReport
      tags: [reports]
      summary: Balance sheet for an org
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The balance sheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSheetReport"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/bank-transactions:
    get:
      operationId: listBankTransactions
      tags: [bank]
      summary: List bank transactions for an org
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: status
          in: query
          required: false
          description: Filter by reconciliation status.
          schema:
            type: string
            enum: [unmatched, matched, all]
            default: unmatched
      responses:
        "200":
          description: The bank transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransactionList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/bank-transactions/{txnId}/categorize:
    post:
      operationId: categorizeBankTransaction
      tags: [bank]
      summary: Categorize (reconcile) a bank transaction
      description: >-
        Matches an unmatched bank transaction to a chart account, posting the
        correct double-entry through the ledger posting service and linking the
        transaction to the posted entry. Idempotent per transaction.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: txnId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategorizeInput"
      responses:
        "200":
          description: The reconciled bank transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransaction"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/bank/status:
    get:
      operationId: getBankStatus
      tags: [bank]
      summary: Bank connection and sync status
      description: >-
        Whether a bank is connected, the institution, last sync time, count of
        pending (unreconciled) transactions, and the last sync error if any.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The bank status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankStatus"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/bank/link-token:
    post:
      operationId: createBankLinkToken
      tags: [bank]
      summary: Create a Plaid Link token to start bank connection
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The Plaid Link token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankLinkToken"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Bank connection is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/bank/exchange:
    post:
      operationId: exchangeBankToken
      tags: [bank]
      summary: Exchange a Plaid public token and connect the account
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankExchangeInput"
      responses:
        "200":
          description: The connected bank status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankStatus"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Bank connection is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/bank/sync:
    post:
      operationId: syncBank
      tags: [bank]
      summary: Pull the latest transactions from the connected bank
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankSyncResult"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No bank connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Bank connection is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: List invoices for an org
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The invoices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createInvoice
      tags: [invoices]
      summary: Create an invoice (posts Dr A/R / Cr revenue)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: The created invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/invoices/{invoiceId}/send:
    post:
      operationId: sendInvoice
      tags: [invoices]
      summary: Mark an invoice as sent to the customer
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/invoices/{invoiceId}/pay:
    post:
      operationId: payInvoice
      tags: [invoices]
      summary: Record a payment on an invoice (posts Dr cash / Cr A/R)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoicePaymentInput"
      responses:
        "200":
          description: The updated invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invoice not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/tax-estimate:
    get:
      operationId: getTaxEstimate
      tags: [tax]
      summary: Estimated tax set-aside (estimate only, not tax advice)
      description: >-
        A rough set-aside estimate derived from current net income times a
        set-aside rate. This is an estimate for cash-planning only — not tax
        advice and not a filing.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: rate
          in: query
          required: false
          description: Set-aside rate as a fraction (e.g. 0.25 for 25%). Defaults to 0.25.
          schema:
            type: number
      responses:
        "200":
          description: The tax set-aside estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxEstimate"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/import:
    post:
      operationId: importAccountingFile
      tags: [import]
      summary: Import a QBO/Xero export via the posting service
      description: >-
        Ingests a normalized accounting export. Every economic event posts
        through the ledger. Fully idempotent by file content: a content hash is
        computed server-side, so re-importing the same file posts nothing new.
        Returns a reconciliation report proving the ledger reproduces the file's
        own trial balance.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportFileInput"
      responses:
        "200":
          description: The reconciliation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationReport"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/import/preview:
    post:
      operationId: previewImport
      tags: [import]
      summary: Preview a vendor export (CSV/XLSX) before importing
      description: >-
        Dry-run adapter step. Translates a raw vendor export (currently a
        QuickBooks Online "Trial Balance" CSV or XLSX) into the canonical import
        draft WITHOUT posting anything to the ledger. Returns the resolved
        accounts (with account-type resolution flagged when ambiguous) and the
        canonical draft the client confirms and then posts to /orgs/{orgId}/import.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPreviewInput"
      responses:
        "200":
          description: The parsed preview and canonical draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreviewResult"
        "400":
          description: The file could not be read as the declared report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/bills:
    get:
      operationId: listBills
      tags: [bills]
