openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication — signup, login, logout, session
  - name: practice
    description: Accounting practice layer — cross-client access, dashboard, batch export
  - name: close
    description: Month-end close management per client
  - name: orgs
    description: Freelancer organizations — onboarding, membership, chart of accounts
  - name: reports
    description: Ledger-derived financial reports (trial balance, P&L, balance sheet)
  - name: bank
    description: Bank connection (Plaid) and reconciliation of bank transactions
  - name: invoices
    description: Accounts-receivable invoicing via the posting service
  - name: tax
    description: Tax set-aside estimator (estimate only, not tax advice)
  - name: import
    description: Migrate-in — import a QBO/Xero export via the posting service
  - name: bills
    description: Accounts-payable bills via the posting service
  - name: payroll
    description: Payroll runs ingested from a provider (display only)
  - name: members
    description: Org membership — user management, roles, accountant collaboration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create an account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          description: Account created; session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials (also returned for a locked account, to avoid leaking account existence)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Session ended
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Return the currently authenticated user
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /practice/clients:
    get:
      operationId: listPracticeClients
      tags: [practice]
      summary: List a practice user's clients
      description: >-
        Returns exactly the client orgs the practice user has been explicitly
        granted (the client switcher/list). Ungranted clients never appear.
        Identity comes from the authenticated session, not the request.
      responses:
        "200":
          description: The user's granted clients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /practice/dashboard:
    get:
      operationId: getPracticeDashboard
      tags: [practice]
      summary: Practice-level dashboard across all granted clients
      description: >-
        Read-only cross-client status: latest close progress and headline
        financials for every client the user was granted. Money fields are
        decimal strings. Identity comes from the authenticated session.
      parameters:
        - name: practiceId
          in: query
          required: false
          description: Restrict to a single practice the user is a member of.
          schema:
            type: string
      responses:
        "200":
          description: The practice dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeDashboard"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /practice/batch-export:
    post:
      operationId: batchExportReports
      tags: [practice]
      summary: Run and export a report across a book of clients
      description: >-
        Runs the same report across the requested clients (restricted to the
        ones the user was granted) and serializes them to CSV (one file per
        client) or a single multi-sheet Excel workbook. Rejects the request if
        it references a client the user was not granted, unless skipUnauthorized
        is set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchExportRequest"
      responses:
        "200":
          description: The exported files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchExportResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The request referenced an ungranted client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{orgId}/close-periods:
    get:
      operationId: listClosePeriods
      tags: [close]
      summary: List a client's close periods
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The client's close periods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosePeriodList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The user was not granted this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{orgId}/close-periods/{periodId}/status:
    get:
      operationId: getCloseStatus
      tags: [close]
      summary: Derived status of one close period
      description: >-
        Checklist progress and PBC request state for a close period. Progress is
        derived from the tasks, never stored.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: periodId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The close period status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseStatusSummary"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The user was not granted this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /practice:
    post:
      operationId: createPractice
      tags: [practice]
      summary: Create a practice (firm)
      description: >-
        Creates a practice and adds the session user as its owner member.
        Membership alone grants NO client access — clients must be granted
        explicitly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeInput"
      responses:
        "201":
          description: The created practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Practice"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /practice/{practiceId}/clients:
    post:
      operationId: grantPracticeClient
      tags: [practice]
      summary: Grant a practice access to a client org
      description: >-
        The caller must hold members.manage on the CLIENT org — the client's
        admin authorizes their own books to the firm, so a practice member can
        never self-grant an org they do not administer. Audit-logged against
        the client org.
      parameters:
        - name: practiceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantClientInput"
      responses:
        "201":
          description: The active grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientGrant"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a practice member or lacks members.manage on the client org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /practice/switch/{orgId}:
    post:
      operationId: switchToClient
      tags: [practice]
      summary: Switch into a granted client (audited)
      description: >-
        Asserts the session user's grant, audit-logs the access event against
        the client org, and returns the client organization.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The client organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The user was not granted this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /practice/batch-report:
    post:
      operationId: runBatchReport
      tags: [practice]
      summary: Run the same report across a book of clients
      description: >-
        Runs the report across the requested clients (restricted to granted
        ones) and returns one tabular sheet per client. Money cells are decimal
        strings. Rejects ungranted clients unless skipUnauthorized is set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchReportRequest"
      responses:
        "200":
          description: One sheet per client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchReportResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The request referenced an ungranted client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{orgId}/close-periods/create:
    post:
      operationId: createClosePeriod
      tags: [close]
      summary: Open a close period for a client
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClosePeriodInput"
      responses:
        "201":
          description: The created close period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosePeriod"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The user was not granted this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{orgId}/close-periods/{periodId}/set-status:
    post:
      operationId: setClosePeriodStatus
      tags: [close]
      summary: Move a close period through its lifecycle
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: periodId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClosePeriodStatusInput"
      responses:
        "200":
          description: The updated close period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClosePeriod"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The user was not granted this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{orgId}/close-periods/{periodId}/tasks:
    post:
      operationId: addCloseTask
      tags: [close]
      summary: Add a checklist task to a close period
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: periodId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseTaskInput"
      responses:
        "201":
          description: The created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseTask"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The user was not granted this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{orgId}/close-tasks/{taskId}/set-status:
    post:
      operationId: setCloseTaskStatus
      tags: [close]
      summary: Update a checklist task's status
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseTaskStatusInput"
      responses:
        "200":
          description: The updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseTask"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The user was not granted this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{orgId}/close-periods/{periodId}/pbc:
    post:
      operationId: createPbcRequest
      tags: [close]
      summary: Ask the client to prepare something (PBC request)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: periodId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PbcRequestInput"
      responses:
        "201":
          description: The created PBC request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PbcRequest"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The user was not granted this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /clients/{orgId}/pbc/{requestId}/accept:
    post:
      operationId: acceptPbcRequest
      tags: [close]
      summary: Accept a provided PBC request (practice side)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The accepted PBC request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PbcRequest"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The user was not granted this client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/close-status:
    get:
      operationId: getMyCloseStatus
      tags: [close]
      summary: Latest close status for the caller's own org (client side)
      description: >-
        The client-facing view of the month-end close: the latest period's
        checklist progress and the PBC requests the client should respond to.
        Gated by org membership (reports.read), not a practice grant.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The latest close status, or null when no close exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyCloseStatus"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The user is not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/pbc/{requestId}/respond:
    post:
      operationId: respondPbcRequest
      tags: [close]
      summary: Respond to a PBC request (client side)
      description: >-
        The client supplies what the practice asked for, moving the request to
        "provided". Gated by org membership (ledger.post), not a practice grant.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PbcResponseInput"
      responses:
        "200":
          description: The provided PBC request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PbcRequest"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The user is not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs:
    get:
      operationId: listMyOrgs
      tags: [orgs]
      summary: List organizations the authenticated user belongs to
      description: >-
        Returns exactly the orgs the session user has an active membership in.
        Identity comes from the session — never from the request.
      responses:
        "200":
          description: The user's organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrg
      tags: [orgs]
      summary: Create an organization and seed its starter chart of accounts
      description: >-
        Creates a new org, seeds the standard chart of accounts, and makes the
        session user its owner. Identity comes from the session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrgInput"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Org"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/accounts:
    get:
      operationId: listAccounts
      tags: [orgs]
      summary: List the chart of accounts for an org
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The chart of accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/dashboard:
    get:
      operationId: getOrgDashboard
      tags: [orgs]
      summary: Headline dashboard for an org
      description: >-
        Cash position, current net income, trial-balance totals (which always
        net to zero), and recent ledger activity. Money fields are decimal
        strings.
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The org dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgDashboard"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/reports/trial-balance:
    get:
      operationId: getTrialBalanceReport
      tags: [reports]
      summary: Trial balance for an org
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The trial balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialBalanceReport"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/reports/profit-and-loss:
    get:
      operationId: getProfitAndLossReport
      tags: [reports]
      summary: Profit and loss for an org
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The profit and loss
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfitAndLossReport"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/reports/balance-sheet:
    get:
      operationId: getBalanceSheetReport
      tags: [reports]
      summary: Balance sheet for an org
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: The balance sheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceSheetReport"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/bank-transactions:
    get:
      operationId: listBankTransactions
      tags: [bank]
      summary: List bank transactions for an org
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: status
          in: query
          required: false
          description: Filter by reconciliation status.
          schema:
            type: string
            enum: [unmatched, matched, all]
            default: unmatched
      responses:
        "200":
          description: The bank transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransactionList"
        "401":
          description: No valid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orgs/{orgId}/bank-transactions/{txnId}/categorize:
    post:
      operationId: categorizeBankTransaction
      tags: [bank]
      summary: Categorize (reconcile) a bank transaction
      description: >-
        Matches an unmatched bank transaction to a chart account, posting the
        correct double-entry through the ledger posting service and linking the
        transaction to the posted entry. Idempotent per transaction.
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: txnId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategorizeInput"
      responses:
        "200":
          description: The reconciled bank transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankTransaction"
